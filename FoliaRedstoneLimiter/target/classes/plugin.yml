name: FoliaRedstoneLimiter
version: 1.0.0
main: dev.smorki.foliaredstonelimiter.FoliaRedstoneLimiter
api-version: "1.21.11"
author: Smorki
description: Per-region redstone flood limiter built for Folia's regionized threading model.
folia-supported: true

commands:
  frl:
    description: FoliaRedstoneLimiter management command.
    usage: /frl reload
    permission: frl.admin

permissions:
  frl.admin:
    description: Grants access to /frl commands and freeze alerts.
    default: op
